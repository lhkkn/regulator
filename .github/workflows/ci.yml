name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dev tools (ruff + mypy)
        run: python -m pip install --upgrade ruff mypy
      - name: Lint + types
        run: make lint
      - name: Unit tests
        run: python -m unittest discover -s tests
